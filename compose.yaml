# compose.yaml
# https://www.yamllint.com/ - YAML Validator
# https://docs.docker.com/compose/ - Docker Compose

services:
  monolith-discord-bot:
    container_name: monolith-discord-bot
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount only specific directories instead of the entire app
      - ./data:/app/data  # For persistent data
      - ./logs:/app/logs  # For logs
      # Config files
      - ./.env:/app/.env:ro  # Read-only env file
      - ./channel_logger_config.json:/app/channel_logger_config.json
    environment:
      - 'DISCORD_TOKEN=${DISCORD_TOKEN}'
      - 'DOCS_ZIP_URL=${DOCS_ZIP_URL}'
      - 'DOCS_BASE_URL=${DOCS_BASE_URL}'
      - 'DOCS_SUBDIR_IN_ZIP=${DOCS_SUBDIR_IN_ZIP}'
      - 'OPENWEBUI_API_URL=${OPENWEBUI_API_URL}'
      - 'OPENWEBUI_DEFAULT_MODEL=${OPENWEBUI_DEFAULT_MODEL}'
      - 'OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}'
      - 'OPENWEBUI_JWT_TOKEN=${OPENWEBUI_JWT_TOKEN}'
      - 'OLLAMA_API_URL=${OLLAMA_API_URL}'
      - 'PYTHONUNBUFFERED=1'  # Ensure logs are output immediately
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - "hyperspace" 
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
      
networks:
  hyperspace:
    external: true
    name: hyperspace  # Explicit name
  # Fallback network if hyperspace is not available
  default:
    driver: bridge